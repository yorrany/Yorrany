  about:
    eyebrow: "Filosofía y Trayectoria"
    h2: "20 años aprendiendo cómo la gente lee, hace clic y confía."
    career_highlight: "20+ Años de Carrera"
    role_summary: "Psicología y Código"
    credo1_title: "Rigor Visual y Tipografía"
    credo1_desc: "Orígenes en el diseño gráfico y la precisión milimétrica suiza. Donde cada espacio en blanco, proporción y jerarquía visual tiene un propósito estratégico."
    credo2_title: "Psicología de la Elección Humana"
    credo2_desc: "Grado en Psicología para decodificar la toma de decisiones, reduciendo la carga cognitiva y generando conversiones éticas y predecibles."
    credo3_title: "Arquitectura Front-End y Seguridad"
    credo3_desc: "Certificado por The Linux Foundation. Código limpio, componentes resilientes, accesibilidad WCAG AAA y cero fricción con los desarrolladores."
    p1: "Empecé mi carrera en el diseño impreso, obsesionado con la tipografía suiza y las retículas milimétricas. Pero cuando la pantalla se convirtió en nuestro medio principal, entendí que la estética sola no bastaba. Estudié Psicología para comprender el porqué de las decisiones de las personas."
    p2: "Hoy trabajo como Principal Product Designer & Front-End Architect. Eso significa que no entrego solo un prototipo: entrego la estrategia que hay detrás, la comprensión del comportamiento del usuario y la viabilidad técnica para construirlo."
    p3: "He pasado por e-commerces de alta conversión y plataformas complejas de salud digital (de cero a uno). Lo que me mueve es resolver problemas complejos con interfaces simples."
    credentials_title: "Credenciales y Especialidad"
    cred_psych_label: "Formación y Conducta"
    cred_psych_title: "Grado en Psicología"
    cred_psych_desc: "Comportamiento humano y toma de decisiones"
    cred_tech_label: "Arquitectura Técnica"
