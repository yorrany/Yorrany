  privacy:
    back: "Volver al Inicio"
    title: "Política de Privacidad"
    last_updated: "Última actualización: Agosto de 2026"
    p1: "Su privacidad es fundamental. Esta Política de Privacidad explica cómo yorrany.com.br recopila, utiliza y protege su información."
    h1: "1. Recopilación de Datos"
    p2: "Este sitio web actúa como un portafolio profesional. Recopilamos información de forma mínima, como datos analíticos anónimos para monitorizar el tráfico e información proporcionada voluntariamente si se pone en contacto (por correo electrónico, LinkedIn o WhatsApp)."
    h2: "2. Uso de la Información"
    p3: "Cualquier información enviada a través de canales de contacto se utilizará estrictamente para la comunicación profesional. No vendemos, alquilamos ni compartimos sus datos con terceros."
    h3: "3. Cookies y Seguridad"
    p4: "Podemos utilizar cookies estrictamente necesarias para el funcionamiento y la seguridad del sitio web (como Cloudflare contra abusos)."
    h4: "4. Sus Derechos"
    p5: "Tiene derecho a solicitar la eliminación de cualquier dato personal o comunicación intercambiada. Para ello, envíe un correo electrónico a yorranymb@gmail.com."
