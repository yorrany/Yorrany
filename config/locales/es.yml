  europe:
    time_label: "Lisboa (WET) · Madrid (CET)"
    h2: "Expandiendo Impacto: Europa y Equipos Globales 🇪🇺"
    desc: "Uniendo arquitectura de software, design systems escalables y psicología del comportamiento desde hace más de una década. Mi objetivo actual es integrarme en equipos de producto de alto impacto en Portugal 🇵🇹, España 🇪🇸 o con husos horarios europeos (CET/WET). Aporto autonomía sénior, alto rigor técnico y una sólida cultura de trabajo asíncrono y remoto."
