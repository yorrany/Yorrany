  pillars:
    title: "LO QUE TRAIGO A LA MESA"
    heading: "Lo que realmente hace que un producto funcione"
    subheading: "Tres competencias estratégicas combinadas para conectar la visión del negocio con la experiencia del usuario y la viabilidad técnica."
    prefix1: "01 • Sistemas Visuales"
    tag1: "Design Tokens"
    tag1_hl: "Consistencia Total"
    prefix2: "02 • Psicología & IHC"
    tag2: "Heurísticas & Decisión"
    tag2_hl: "Alta Conversión"
    prefix3: "03 • Ingeniería Front-End"
    tag3: "The Linux Foundation"
    tag3_hl: "Cero Retrabajo"
    pillar1_title: "Diseño que escala (sin volverse burocracia)"
    pillar1_desc: "No solo dibujo pantallas; construyo sistemas. Lidero la creación y el mantenimiento de design systems que el equipo de desarrollo realmente quiere usar. Del discovery al delivery, mi foco está en alinear lo que el negocio necesita con lo que el usuario consigue entender: consistencia visual y velocidad para el equipo."
    pillar2_title: "Menos fricción, más claridad (Psicología e IHC)"
    pillar2_desc: "Como psicólogo, miro más allá de los clics. Me pregunto: ¿qué carga cognitiva tiene esta pantalla? ¿Por qué el usuario abandonó aquí? Uso ciencia del comportamiento y evaluaciones heurísticas para diseñar caminos que tienen sentido para el cerebro humano, aumentando la conversión de forma ética y predecible."
    pillar3_title: "El fin del abismo entre diseño e ingeniería"
    pillar3_desc: "El diseño no termina en Figma. Con mi bagaje en front-end y seguridad (JS/Python), hablo el idioma de los desarrolladores. Entiendo las limitaciones técnicas, prevengo fallos de seguridad en la interfaz y me aseguro de que lo diseñado sea viable, accesible y seguro para salir a producción."
