  about:
    eyebrow: "Philosophy & Journey"
    h2: "20 years learning how people read, click and trust."
    credo1_title: "Visual Rigor & Typography"
    credo1_desc: "Roots in graphic design and Swiss typographic precision. Where every whitespace, ratio, and visual hierarchy serves strategic purpose."
    credo2_title: "Psychology of Human Choice"
    credo2_desc: "B.Sc. in Psychology to decode human decision-making, reducing cognitive load and driving ethical, predictable conversions."
    credo3_title: "Front-End Architecture & Security"
    credo3_desc: "Certified by The Linux Foundation. Production-ready code, resilient components, WCAG AAA accessibility, and zero developer friction."
    p1: "I started my career in print design, obsessed with Swiss typography and millimetre-perfect grids. But when the screen became our main medium, I realised aesthetics alone weren't enough. I went on to study Psychology to understand the why behind people's choices."
    p2: "Today I work as Principal Product Designer & Front-End Architect. Which means I don't just hand over a prototype: I hand over the strategy behind it, a grasp of user behaviour, and the technical feasibility to build it."
    p3: "I've shipped high-conversion e-commerce and complex digital health platforms (zero to one). What drives me is solving complex problems with simple interfaces."
