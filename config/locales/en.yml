    tag1_hl: "Total Consistency"
    prefix2: "02 • Psychology & HCI"
    tag2: "Heuristics & Choice"
    tag2_hl: "High Conversion"
    prefix3: "03 • Front-End Engineering"
    tag3: "The Linux Foundation"
    tag3_hl: "Zero Dev Rework"
    pillar1_title: "Design that scales (without bureaucracy)"
    pillar1_desc: "I don't just draw screens; I build systems. I establish and govern design systems that developers actually want to use. From discovery to delivery, my focus is bridging what business needs with what users can effortlessly understand: visual consistency and speed for the team."
    pillar2_title: "Frictionless UX (Psychology & HCI)"
    pillar2_desc: "As a psychologist, I look far beyond clicks. I ask: what is the cognitive load of this screen? Why did users drop off here? I apply behavioral science and heuristic audits to design pathways that make sense to the human brain, driving ethical and predictable conversion."
    pillar3_title: "Bridging the design-engineering divide"
    pillar3_desc: "Design doesn't end in Figma. With a strong foundation in front-end architecture and security (JS/Python), I speak developers' language. I understand technical constraints, prevent UI security flaws, and ensure what's designed is viable, accessible, and ready for production."
