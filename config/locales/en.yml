    subtitle: "A selection of products where design strategy and behavioral insights drove measurable business impact."
    spotlightBadge: "Featured Spotlight"
    viewCase: "Read Case Study"
    behavioralEdge: "Behavioral Edge"
    filters:
      all: "All"
      pd: "Product Design"
