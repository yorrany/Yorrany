en:
  hero:
    h1: "Design, behaviour and code. What actually makes a product work."
    sub: "Twenty years in, I've learned one thing: a beautiful interface won't save a confusing product. I design experiences shaped around the human mind and built with the technical rigour your engineering team expects."
    cta_primary: "View portfolio"
    cta_secondary: "Discuss a role in Europe"
  pillars:
    title: "WHAT I BRING TO THE TABLE"
    pillar1_title: "Design that scales (without turning into bureaucracy)"
    pillar1_desc: "I don't just draw screens; I build systems. I lead the creation and maintenance of design systems that developers actually want to use. From discovery to delivery, my focus is aligning what the business needs with what users can understand, keeping visual consistency and team velocity intact."
    pillar2_title: "Less friction, more clarity (Psychology & HCI)"
    pillar2_desc: "As a psychologist, I look beyond the clicks. I ask: what's the cognitive load on this screen? Why did the user drop off here? I use behavioural science and heuristic evaluations to design paths that make sense to the human brain, raising conversion ethically and predictably."
    pillar3_title: "Closing the gap between design and engineering"
    pillar3_desc: "Design doesn't end in Figma. With my background in front-end and security (JS/Python), I speak the developers' language. I understand technical constraints, prevent security flaws at the interface level, and make sure what gets designed is actually buildable, accessible and safe to ship."
  work:
    eyebrow: "Case Studies"
