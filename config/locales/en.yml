  about:
    eyebrow: "Philosophy & Track Record"
    h2: "20 years mastering how people read, click, and trust."
    career_highlight: "20+ Years Career"
    role_summary: "Psychology & Code"
    credo1_title: "Visual Rigor & Typography"
    credo1_desc: "Rooted in Swiss typographic precision and editorial graphic design. Where every whitespace, grid ratio, and typographic hierarchy serves a deliberate strategic goal."
    credo2_title: "Psychology of Human Choice"
    credo2_desc: "B.Sc. in Psychology applied to decode decision-making, eliminate cognitive overload, and engineer high-converting, ethical user experiences."
    credo3_title: "Front-End Architecture & Security"
    credo3_desc: "Certified by The Linux Foundation. Clean semantic code, production-grade accessibility (WCAG AAA), and seamless collaboration with engineering teams."
    p1: "I began my design career in print, obsessed with Swiss grids and micro-typography. But when digital interfaces became the world's primary medium, I realized aesthetics alone were insufficient. I earned a degree in Psychology to deeply understand why people make decisions."
    p2: "Today, I operate as a Principal Product Designer & Front-End Architect. That means I don't just deliver mockups: I deliver the underlying product strategy, behavioral insight, and the engineering viability to ship it."
    p3: "Having shaped high-conversion e-commerce infrastructures and complex 0-to-1 digital health platforms, what drives me is resolving deep technical complexity with elegant, simple interfaces."
