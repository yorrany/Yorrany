    desc: "Unindo arquitetura de software, design systems escaláveis e psicologia comportamental há mais de uma década. Meu foco atual é integrar equipes de produto de alto impacto em Portugal 🇵🇹, Espanha 🇪🇸 ou com fusos horários europeus (CET/WET). Trago autonomia sênior, rigor técnico e forte cultura de trabalho assíncrono e remoto."
