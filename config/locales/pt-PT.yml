  pillars:
    title: "DIFERENCIAIS DE ATUAÇÃO"
    heading: "O que realmente faz um produto funcionar"
    subheading: "Três competências estratégicas combinadas para conectar a visão de negócios à experiência do usuário e à viabilidade de engenharia."
    prefix1: "01 • Sistemas Visuais"
    tag1: "Design Tokens"
    tag1_hl: "Consistência Total"
    prefix2: "02 • Psicologia & IHC"
    tag2: "Heurísticas & Decisão"
    tag2_hl: "Alta Conversão"
    prefix3: "03 • Engenharia Front-End"
    tag3: "The Linux Foundation"
    tag3_hl: "Zero Retrabalho"
    pillar1_title: "Design que escala (sem burocracia)"
    pillar1_desc: "Não apenas crio telas; construo sistemas. Lidero e governo design systems que os desenvolvedores realmente usam com prazer. Do discovery ao delivery, foco em alinhar necessidades de negócio à compreensão do usuário: consistência visual e velocidade para o time."
    pillar2_title: "Menos atrito, mais clareza (Psicologia e IHC)"
    pillar2_desc: "Como psicólogo, vejo muito além dos cliques. Avalio a carga cognitiva, modelos mentais e heurísticas de decisão para eliminar pontos de fricção e conduzir o usuário com naturalidade, gerando conversões éticas e sustentáveis."
    pillar3_title: "Fim do abismo entre design e engenharia"
    pillar3_desc: "O design não termina no Figma. Fluente em front-end e segurança (JS/Python), falo a mesma língua dos desenvolvedores. Entendo limites técnicos, previno vulnerabilidades na UI e garanto entrega pronta para produção com acessibilidade WCAG AAA."
