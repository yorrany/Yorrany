    eyebrow: "Experiência & Formação"
    title: "Currículo & Credenciais"
    subtitle: "Uma linha do tempo da minha trajetória profissional, pesquisas académicas e certificações técnicas."
  about:
    h2: "20 anos a aprender como as pessoas leem, clicam e confiam."
    p1: "Comecei a minha carreira no design impresso, obcecado pela tipografia suíça e pelas grelhas milimétricas. Mas quando o ecrã se tornou o nosso principal meio, percebi que a estética sozinha não bastava. Fui estudar Psicologia para perceber o porquê das escolhas das pessoas."
    p2: "Hoje atuo como Principal Product Designer & Front-End Architect. Isto significa que não entrego apenas um protótipo: entrego a estratégia por trás dele, a compreensão do comportamento do utilizador e a viabilidade técnica para o construir."
    p3: "Já passei por e-commerces de alta conversão e plataformas complexas de saúde digital (do zero ao um). O que me move é resolver problemas complexos com interfaces simples."
    credentials: "Credenciais: Licenciatura em Psicologia (comportamento humano) · Front-End Architecture, Python e JS Security (The Linux Foundation) · Foco: saúde digital, e-commerce, design systems."
  europe:
    h2: "Próximos passos: foco na Europa 🇪🇺"
    desc: "Estou num momento de carreira em que procuro juntar novos desafios técnicos à qualidade de vida. O meu foco atual é a realocação para Portugal 🇵🇹 ou Espanha 🇪🇸, ou trabalhar remotamente com equipas que operem nos fusos europeus (CET/WET). Tenho total autonomia para trabalho remoto, setup próprio, e procuro uma equipa que valorize a maturidade de um produto bem construído."
    status: "Status UE: Elegível / Aberto a sponsorship · Modelo: 100% remoto, híbrido ou realocação · Fuso: CET/WET"
    cta_primary: "Descarregar CV completo"
    cta_secondary: "Contactar no LinkedIn"
