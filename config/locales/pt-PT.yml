  hero:
    h1: "Design, comportamento e código. O que realmente faz um produto funcionar."
    sub: "Depois de 20 anos construindo produtos digitais, aprendi que uma interface bonita não salva um produto confuso. Crio experiências desenhadas para a mente humana e com a solidez técnica que a sua equipe de engenharia exige."
