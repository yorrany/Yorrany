pt-PT:
  hero:
    h1: "Design, comportamento e código. O que realmente faz um produto funcionar."
    sub: "Em 20 anos de estrada, aprendi que uma interface bonita não salva um produto confuso. Crio experiências pensadas para a mente humana e construídas com a solidez técnica que a sua equipa de engenharia exige."
    cta_primary: "Ver portefólio"
    cta_secondary: "Falar sobre oportunidades na Europa"
  pillars:
    title: "O QUE TRAGO À MESA"
    pillar1_title: "Design que escala (sem virar burocracia)"
    pillar1_desc: "Não crio apenas ecrãs; construo sistemas. Lidero a criação e a manutenção de design systems que a equipa de desenvolvimento quer mesmo usar. Do discovery à entrega, o meu foco é alinhar o que o negócio precisa com o que o utilizador consegue entender, consistência visual e velocidade para a equipa."
    pillar2_title: "Menos atrito, mais clareza (Psicologia e IHC)"
    pillar2_desc: "Como psicólogo, olho para além dos cliques. Pergunto-me: qual é a carga cognitiva deste ecrã? Porque é que o utilizador desistiu aqui? Uso ciência comportamental e avaliações heurísticas para desenhar caminhos que fazem sentido para o cérebro humano, aumentando a conversão de forma ética e previsível."
    pillar3_title: "O fim do abismo entre o design e a engenharia"
    pillar3_desc: "O design não termina no Figma. Com a minha bagagem em front-end e segurança (JS/Python), falo a língua dos programadores. Entendo as limitações técnicas, previno falhas de segurança na interface e garanto que o que foi desenhado é, de facto, viável, acessível e seguro para ir para produção."
