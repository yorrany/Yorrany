    title: "Política de Privacidade"
    last_updated: "Última atualização: Agosto de 2026"
    p1: "Sua privacidade é fundamental. Esta Política de Privacidade explica como o yorrany.com.br coleta, utiliza e protege suas informações."
    h1: "1. Coleta de Informações"
    p2: "Este site funciona como um portfólio profissional. Coletamos dados mínimos como estatísticas anônimas de acesso para monitoramento de desempenho e informações enviadas voluntariamente ao iniciar contato direto (e-mail, LinkedIn ou WhatsApp)."
    h2: "2. Uso das Informações"
    p3: "As informações recebidas são usadas estritamente para comunicação profissional. Não vendemos, alugamos ou compartilhamos seus dados com terceiros."
    h3: "3. Cookies e Segurança"
    p4: "Podemos utilizar cookies estritamente necessários para o funcionamento e segurança do site (como proteção do Cloudflare contra acessos indevidos)."
    h4: "4. Seus Direitos"
    p5: "Você tem o direito de solicitar a exclusão de seus dados ou histórico de contato a qualquer momento enviando um e-mail para yorranymb@gmail.com."
