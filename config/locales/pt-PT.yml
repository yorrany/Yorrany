  about:
    eyebrow: "Filosofia & Trajetória"
    h2: "20 anos aprendendo como as pessoas leem, clicam e confiam."
    career_highlight: "20+ Anos de Carreira"
    role_summary: "Psicologia & Código"
    credo1_title: "Rigor Visual & Tipografia"
    credo1_desc: "Origens no design gráfico editorial e na precisão milimétrica suíça. Onde cada espaçamento, proporção e hierarquia visual tem propósito estratégico."
    credo2_title: "Psicologia da Escolha Humana"
    credo2_desc: "Graduação em Psicologia para decifrar a tomada de decisão, reduzindo a sobrecarga cognitiva e gerando conversões éticas e sustentáveis."
    credo3_title: "Arquitetura Front-End & Segurança"
    credo3_desc: "Certificado pela The Linux Foundation. Código limpo, componentes resilientes, acessibilidade WCAG AAA e zero fricção com os desenvolvedores."
    p1: "Iniciei minha trajetória no design impresso, fascinado pela tipografia suíça e grids rigorosos. Quando o meio digital se tornou dominante, percebi que a estética precisava se unir à ciência: cursei Psicologia para compreender a fundo o comportamento e a tomada de decisão humana."
    p2: "Hoje atuo como Principal Product Designer & Front-End Architect. Isso significa que não entrego apenas layouts: entrego a estratégia de produto, a arquitetura da informação e a viabilidade técnica pronta para produção."
    p3: "Com histórico em e-commerces de alto volume e produtos digitais de saúde (0 a 1), meu propósito é resolver problemas complexos com interfaces limpas, intuitivas e eficientes."
    credentials_title: "Credenciais & Especialidade"
    cred_psych_label: "Formação & Comportamento"
    cred_psych_title: "Bacharelado em Psicologia"
    cred_psych_desc: "Comportamento humano & tomada de decisão"
